<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orso Heladería Radio</title>
<meta name="description" content="Escucha Orso Heladería Radio en vivo — programada y administrada por AMS.">

<meta name="twitter:description" content="Escucha Orso Heladería Radio en vivo — programada y administrada por AMS.">

<!-- PWA -->
<meta name="theme-color" content="#0e161c">
<link rel="apple-touch-icon" href="https://ams-online.co/orso-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orso Radio">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    /* Paleta fría para esta página -- Orso es una heladería, el logo ya
       nace en azul hielo sobre negro, así que en vez del carbón cálido de
       AMS usamos un casi-negro con sesgo azul, tipo noche de invierno. */
    --bg:#0e161c;
    --bg-soft:#16212a;
    --fg:#eef6f8;
    --fg-dim:#7f96a0;
    --fg-faint:#55666d;
    --line:#223038;
    --line-soft:#1a262d;
    --accent-atmosphere:#97c49d;
    --accent-voice:#c4b497;
    --accent-authority:#9797c4;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; background:var(--bg);}
  body{
    /* el color de fondo lo pinta el elemento HTML; el body va TRANSPARENTE para que las
       capas de efectos (z-index negativo: estrellas, foco, ondas) se vean */
    margin:0;background:transparent;color:var(--fg);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:
      calc(2.5rem + env(safe-area-inset-top))
      calc(1.25rem + env(safe-area-inset-right))
      calc(2.5rem + env(safe-area-inset-bottom))
      calc(1.25rem + env(safe-area-inset-left));
    overflow-x:hidden;
  }

  /* ---------- Foco de luz ambiental (igual al de ams-online.co), cambiando
     infinita y suavemente entre los tres colores de los planes ---------- */
  @property --amb-glow{
    syntax: "<color>";
    inherits: true;
    initial-value: rgba(151,196,157,0.13);
  }
  .ambient{
    position:fixed; top:0; left:0; width:100%; height:100vh; height:100lvh; transform:translateZ(0); z-index:-1;
    pointer-events:none;
    --amb-glow: color-mix(in srgb, var(--accent-atmosphere) 13%, transparent);
    animation: amb-cycle 30s linear infinite;
    background:
      radial-gradient(100% 55% at 50% -6%, rgba(207,239,245,0.06), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,0.22), transparent 26%, rgba(207,239,245,0.024));
  }
  .ambient::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(44% 34% at 50% 38%, var(--amb-glow), transparent 72%);
    opacity:0.65;
  }
  .wave{
    position:absolute;
    left:50%; top:38%;
    width:72vmax; height:72vmax; margin:-36vmax 0 0 -36vmax;
    border-radius:50%;
    background: radial-gradient(circle,
      var(--amb-glow) 0%,
      color-mix(in srgb, var(--amb-glow) 45%, transparent) 32%,
      transparent 60%);
    opacity:0;
    transform:scale(0.45);
    animation: amb-wave 14s ease-out infinite;
  }
  .wave:nth-child(2){ animation-delay:-4.66s; }
  .wave:nth-child(3){ animation-delay:-9.33s; }
  @keyframes amb-wave{
    0%   { transform:scale(0.42); opacity:0; }
    16%  { opacity:0.55; }
    100% { transform:scale(1.75); opacity:0; }
  }
  @keyframes amb-cycle{
    0%      { --amb-glow: color-mix(in srgb, var(--accent-atmosphere) 13%, transparent); }
    33.333% { --amb-glow: color-mix(in srgb, var(--accent-voice) 13%, transparent); }
    66.666% { --amb-glow: color-mix(in srgb, var(--accent-authority) 13%, transparent); }
    100%    { --amb-glow: color-mix(in srgb, var(--accent-atmosphere) 13%, transparent); }
  }
  @media (prefers-reduced-motion: reduce){
    .ambient{ animation:none; }
    .wave{ animation:none; opacity:0; }
    .ambient::before{ opacity:1; }
  }

  .card{max-width:520px;width:100%;text-align:center}
  .logo-mark{
    width:100%;max-width:300px;height:auto;
    display:block;margin:0 auto 2.4rem;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.5));
  }

  /* ---------- Reproductor en vivo (tomado tal cual del sitio principal) ---------- */
  .live-player{
    display:flex;align-items:center;gap:20px;
    justify-content:center;
  }
  .live-toggle{
    flex-shrink:0;
    width:56px; height:56px;
    display:grid; place-items:center;
    border:1.5px solid var(--fg-dim);
    border-radius:50%;
    background:none;
    color:var(--fg);
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .live-toggle:hover{ border-color:var(--fg); background:var(--bg-soft); }
  .live-toggle:active{ transform:scale(0.94); }
  .live-play, .live-pause, .live-spinner{ display:none; }
  .live-play{
    width:0; height:0; margin-left:3px;
    border-style:solid; border-width:9px 0 9px 14px;
    border-color:transparent transparent transparent currentColor;
  }
  .live-pause{ width:14px; height:17px; border-left:5px solid currentColor; border-right:5px solid currentColor; }
  .live-spinner{
    width:20px; height:20px;
    border:2.5px solid var(--line);
    border-top-color:var(--fg-dim);
    border-radius:50%;
    animation:live-spin 0.7s linear infinite;
  }
  @keyframes live-spin{ to{ transform:rotate(360deg); } }
  .live-player[data-state="idle"]        .live-play{ display:block; }
  .live-player[data-state="error"]       .live-play{ display:block; }
  .live-player[data-state="playing"]     .live-pause{ display:block; }
  .live-player[data-state="loading"]     .live-spinner{ display:block; }
  .live-player[data-state="reconnecting"] .live-spinner{ display:block; }

  .live-meta{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .live-label{
    display:flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.86rem;
    letter-spacing:0.1em;
    color:var(--fg);
  }
  .live-player[data-state="error"] .live-status::after{ content:" · sin señal"; color:var(--fg-faint); }
  .bars{ display:flex; align-items:flex-end; gap:3px; height:16px; }
  .bars span{
    width:3px; background:var(--fg-dim);
    transform:scaleY(0.3); transform-origin:bottom;
    transition:transform 0.3s ease;
  }
  .bars span:nth-child(1){ height:40%; }
  .bars span:nth-child(2){ height:100%; }
  .bars span:nth-child(3){ height:60%; }
  .bars span:nth-child(4){ height:85%; }
  .bars span:nth-child(5){ height:50%; }
  .live-player[data-state="playing"] .bars span{ animation: micro-bar 1.4s ease-in-out infinite; }
  .live-player[data-state="playing"] .bars span:nth-child(1){ animation-delay:0s; }
  .live-player[data-state="playing"] .bars span:nth-child(2){ animation-delay:0.2s; }
  .live-player[data-state="playing"] .bars span:nth-child(3){ animation-delay:0.4s; }
  .live-player[data-state="playing"] .bars span:nth-child(4){ animation-delay:0.6s; }
  .live-player[data-state="playing"] .bars span:nth-child(5){ animation-delay:0.8s; }
  @keyframes micro-bar{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(0.35); } }
  @media (prefers-reduced-motion: reduce){
    .live-spinner{ animation:none; }
    .live-player[data-state="playing"] .bars span{ animation:none; transform:scaleY(0.6); }
  }

  .listeners{
    margin-top:1.8rem;font-family:'IBM Plex Mono',monospace;font-size:.74rem;
    color:var(--fg-faint);letter-spacing:.04em;
  }
  .listeners b{color:var(--fg-dim);font-weight:500}
  .back{
    display:inline-block;margin-top:2.4rem;
    font-family:'Archivo',sans-serif;font-weight:500;font-size:.86rem;
    color:var(--fg-faint);text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:var(--line);
  }
  .back:hover{ color:var(--fg-dim); text-decoration-color:var(--fg-faint); }

  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .6s ease both}
    .logo-mark{
      transform-origin:50% 50%;
      animation:
        logo-pop .85s cubic-bezier(.34,1.56,.64,1) .05s both,
        logo-spring 180s ease-out 1.1s infinite;
    }
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* rebote tipo resorte: entra cayendo desde arriba y luego repite el mismo
     impulso de forma infinita (mismo movimiento que la entrada, mas sutil) */
  @keyframes logo-pop{
    0%   { transform:scale(0.5) translateY(-24px); opacity:0; }
    55%  { transform:scale(1.07) translateY(0);    opacity:1; }
    72%  { transform:scale(0.95); }
    86%  { transform:scale(1.03); }
    100% { transform:scale(1); }
  }
  @keyframes logo-spring{
    /* ciclo = 180s -> un rebote de resorte visible cada 3 minutos */
    0%, 98.3% { transform:scale(1) translateY(0); }
    98.8%     { transform:scale(0.94) translateY(5px); }
    99.2%     { transform:scale(1.07) translateY(-11px); }
    99.5%     { transform:scale(0.98) translateY(0); }
    99.75%    { transform:scale(1.03) translateY(-3px); }
    100%      { transform:scale(1) translateY(0); }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="wave"></span><span class="wave"></span><span class="wave"></span></div>
  <div class="card">
    <img class="logo-mark" src="https://ams-online.co/orso-logo.svg" alt="Orso Heladería Radio">

    <div class="live-player" data-state="idle">
      <button type="button" class="live-toggle" aria-label="Escuchar la emisora en vivo">
        <span class="live-play" aria-hidden="true"></span>
        <span class="live-pause" aria-hidden="true"></span>
        <span class="live-spinner" aria-hidden="true"></span>
      </button>
      <div class="live-meta">
        <span class="live-label">
          <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
          <span class="live-status">TOCAR EN VIVO</span>
        </span>
      </div>
      <audio id="ams-stream" preload="none">
        <source src="https://relay.ams-online.co/orso" type="audio/mpeg">
      </audio>
    </div>

    <p class="listeners"><b id="listener-count">—</b> oyentes conectados ahora</p>
    <a class="back" href="https://ams-online.co/">Programada y administrada por AMS →</a>
  </div>

  <script>
    (function(){
      var player = document.querySelector('.live-player');
      var audio  = document.getElementById('ams-stream');
      var toggle = player.querySelector('.live-toggle');
      var statusEl = player.querySelector('.live-status');
      var countEl  = document.getElementById('listener-count');
      var META_URL = 'https://relay.ams-online.co/count';
      var META_MOUNT = 'orso';
      var pollTimer = null;
      var loadTimer = null;

      function setState(s){ player.dataset.state = s; }

      // ---- pantalla de bloqueo / notificaciones (Media Session API) ----
      // No hace falta instalar nada para esto -- funciona en cualquier
      // navegador que la soporte, mientras el audio este sonando.
      // Solo se muestra el nombre de la emisora, nunca la canción.
      var hasMediaSession = 'mediaSession' in navigator;
      function updateMediaSession(){
        if(!hasMediaSession) return;
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Orso Heladería Radio",
          artist: 'En vivo',
          album: 'AMS Streaming',
          artwork: [
            { src: 'https://ams-online.co/orso-artwork-512.png', sizes: '512x512', type: 'image/png' },
            { src: 'https://ams-online.co/orso-artwork-1024.png', sizes: '1024x1024', type: 'image/png' }
          ]
        });
      }
      if(hasMediaSession){
        navigator.mediaSession.setActionHandler('play', function(){ toggle.click(); });
        navigator.mediaSession.setActionHandler('pause', function(){ toggle.click(); });
        navigator.mediaSession.setActionHandler('stop', function(){ toggle.click(); });
      }

      function fetchNowPlaying(){
        fetch(META_URL + '?m=' + META_MOUNT, { cache: 'no-store' })
          .then(function(r){ return r.json(); })
          .then(function(data){
            if(!data) return;
            var n = (typeof data.total === 'number') ? data.total
                  : (typeof data.unique === 'number') ? data.unique
                  : (typeof data.now === 'number') ? data.now : null;
            if(n !== null) countEl.textContent = n;
          })
          .catch(function(){ /* sin datos nuevos: se deja lo último visible */ });
      }

      // ---- reconexion automatica: si se estaba sonando y el stream se corta,
      // reintenta solo por 1 minuto (igual de rapido que el auto-reinicio del
      // servidor) antes de rendirse y pedir un clic manual. ----
      var RECONNECT_WINDOW_MS = 60000;
      var RECONNECT_EVERY_MS  = 4000;
      var reconnectTimer = null, reconnectDeadline = null;
      var wasPlaying = false, manualPause = false;

      function beginReconnect(){
        if(reconnectTimer) return; // ya en curso
        setState('reconnecting');
        statusEl.textContent = 'RECONECTANDO…';
        clearInterval(pollTimer);
        reconnectDeadline = Date.now() + RECONNECT_WINDOW_MS;
        attemptReconnect();
        reconnectTimer = setInterval(attemptReconnect, RECONNECT_EVERY_MS);
      }
      function attemptReconnect(){
        if(Date.now() > reconnectDeadline){
          clearInterval(reconnectTimer); reconnectTimer = null;
          wasPlaying = false;
          setState('error');
          statusEl.textContent = 'TOCAR EN VIVO';
          return;
        }
        audio.load();
        audio.play().catch(function(){ /* seguimos intentando */ });
      }

      toggle.addEventListener('click', function(){
        var state = player.dataset.state;
        if(state === 'idle' || state === 'error'){
          manualPause = false;
          setState('loading');
          clearTimeout(loadTimer);
          loadTimer = setTimeout(function(){
            if(player.dataset.state === 'loading') setState('error');
          }, 12000);
          audio.play().catch(function(){ setState('error'); });
        } else if(state === 'playing' || state === 'reconnecting'){
          manualPause = true;
          clearInterval(reconnectTimer); reconnectTimer = null;
          wasPlaying = false;
          audio.pause();
        }
      });

      audio.addEventListener('playing', function(){
        clearTimeout(loadTimer);
        clearInterval(reconnectTimer); reconnectTimer = null;
        wasPlaying = true;
        setState('playing');
        statusEl.textContent = 'EN VIVO';
        toggle.setAttribute('aria-label', 'Pausar la emisora');
        if(hasMediaSession){
          updateMediaSession();
          navigator.mediaSession.playbackState = 'playing';
        }
        fetchNowPlaying();
        clearInterval(pollTimer);
        pollTimer = setInterval(fetchNowPlaying, 3000);
      });
      audio.addEventListener('waiting', function(){
        if(!audio.paused && player.dataset.state !== 'reconnecting') setState('loading');
      });
      audio.addEventListener('pause', function(){
        clearTimeout(loadTimer);
        if(wasPlaying && !manualPause){
          beginReconnect(); // el corte disparo un pause -- no fue el oyente
          return;
        }
        setState('idle');
        statusEl.textContent = 'TOCAR EN VIVO';
        toggle.setAttribute('aria-label', 'Escuchar la emisora en vivo');
        if(hasMediaSession) navigator.mediaSession.playbackState = 'paused';
        clearInterval(pollTimer);
      });
      audio.addEventListener('error', function(){
        clearTimeout(loadTimer);
        if(wasPlaying && !manualPause){
          beginReconnect();
        } else {
          setState('error');
          clearInterval(pollTimer);
        }
      });
      audio.addEventListener('stalled', function(){
        if(wasPlaying && !manualPause) beginReconnect();
      });

      fetchNowPlaying();
      setInterval(fetchNowPlaying, 3000);

      // ---- autoplay al cargar, igual que la página anterior de GitHub ----
      // el navegador puede bloquearlo en la primera visita sin interacción
      // previa con el sitio; si pasa, cae de vuelta a "TOCAR EN VIVO" sin
      // romper nada -- es el mismo comportamiento que tenía <audio autoplay>.
      setState('loading');
      statusEl.textContent = 'CARGANDO…';
      loadTimer = setTimeout(function(){
        if(player.dataset.state === 'loading') setState('error');
      }, 12000);
      audio.play().catch(function(){
        clearTimeout(loadTimer);
        setState('idle');
        statusEl.textContent = 'TOCAR EN VIVO';
      });
    })();
  </script>
</body>
</html>
